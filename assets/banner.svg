<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 460" width="1500" height="460" role="img" aria-label="Robert Lukowski — Platform Engineering, Cloud Automation and Agentic AI">
  <title>Robert Lukowski — Platform Engineering, Cloud Automation and Agentic AI</title>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0b1f33">
        <animate attributeName="stop-color" values="#0b1f33;#10203a;#082a2d;#0b1f33" dur="15s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="15%" cy="20%" r="64%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.16;0.34;0.16" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGlow" cx="86%" cy="82%" r="62%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.14;0.31;0.14" dur="8s" begin="-2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#bae6fd"/>
      <stop offset="0.82" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="pipelineLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="0.72" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.8"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7dd3fc" stroke-width="0.6" opacity="0.07"/>
    </pattern>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#020617" flood-opacity="0.65"/>
    </filter>

    <clipPath id="titleReveal">
      <rect x="230" y="54" width="0" height="90">
        <animate attributeName="width" from="0" to="1040" dur="1.7s" begin="0.25s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="subtitleReveal">
      <rect x="80" y="142" width="0" height="42">
        <animate attributeName="width" from="0" to="1340" dur="1.4s" begin="1.4s" fill="freeze"/>
      </rect>
    </clipPath>

    <path id="packetPath" d="M188 295H1312"/>
  </defs>

  <rect width="1500" height="460" rx="24" fill="url(#background)"/>
  <rect width="1500" height="460" rx="24" fill="url(#cyanGlow)"/>
  <rect width="1500" height="460" rx="24" fill="url(#greenGlow)"/>
  <rect width="1500" height="460" rx="24" fill="url(#grid)"/>

  <g clip-path="url(#titleReveal)">
    <text x="750" y="126" text-anchor="middle" fill="url(#titleGradient)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="4">ROBERT LUKOWSKI</text>
  </g>

  <g clip-path="url(#subtitleReveal)">
    <text x="750" y="174" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="3">PLATFORM ENGINEERING · CLOUD AUTOMATION · AGENTIC AI</text>
  </g>

  <text x="750" y="220" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="3">COMMIT-TO-CLOUD DELIVERY PIPELINE</text>

  <line x1="188" y1="295" x2="1312" y2="295" stroke="#0f2940" stroke-width="12" stroke-linecap="round"/>
  <line x1="188" y1="295" x2="1312" y2="295" stroke="url(#pipelineLine)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <g filter="url(#nodeShadow)">
    <g transform="translate(210 295)">
      <circle r="44" fill="#0b1728" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="stroke-width" values="2;5;2" dur="8s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="8s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <path d="M-17-3L-7 7 18-18M-17 13H17" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="75" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2">VALIDATE</text>
      <text y="98" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">syntax · policy</text>
    </g>

    <g transform="translate(570 295)">
      <circle r="44" fill="#0b1728" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="stroke-width" values="2;2;5;2;2" keyTimes="0;0.23;0.3;0.4;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.23;0.3;0.4;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <path d="M-18-15H18V15H-18ZM-10-7L-3 0-10 7M2 8H11" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="75" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2">TEST</text>
      <text y="98" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">quality · resilience</text>
    </g>

    <g transform="translate(930 295)">
      <circle r="44" fill="#0b1728" stroke="#2dd4bf" stroke-width="2">
        <animate attributeName="stroke-width" values="2;2;5;2;2" keyTimes="0;0.47;0.55;0.65;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.47;0.55;0.65;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <path d="M0-21L18-13V1C18 13 10 21 0 26-10 21-18 13-18 1V-13ZM-9 1L-2 8 10-7" fill="none" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="75" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2">SECURITY</text>
      <text y="98" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">identity · guardrails</text>
    </g>

    <g transform="translate(1290 295)">
      <circle r="44" fill="#0b1728" stroke="#fbbf24" stroke-width="2">
        <animate attributeName="stroke-width" values="2;2;6;2" keyTimes="0;0.72;0.82;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0.5;1;0.5" keyTimes="0;0.72;0.82;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <path d="M-20 9C-20-3-11-11 0-11 7-22 25-18 27-5 37-3 40 10 32 16H-17C-28 16-31 2-20-3" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M0-1V19M-8 11L0 19 8 11" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="75" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2">DEPLOY</text>
      <text y="98" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">observable · controlled</text>
    </g>
  </g>

  <g filter="url(#softGlow)">
    <circle r="5" fill="#e0f2fe">
      <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#packetPath"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#5eead4">
      <animateMotion dur="8s" begin="-4s" repeatCount="indefinite"><mpath href="#packetPath"/></animateMotion>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.95;1" dur="8s" begin="-4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#2dd4bf" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    <text x="210" y="300" text-anchor="middle" opacity="0">✓<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.12;0.23" dur="8s" repeatCount="indefinite"/></text>
    <text x="570" y="300" text-anchor="middle" opacity="0">✓<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.34;0.42;0.5" dur="8s" repeatCount="indefinite"/></text>
    <text x="930" y="300" text-anchor="middle" opacity="0">✓<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.58;0.66;0.74" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <text x="750" y="430" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="3">SECURE  ·  AUTOMATED  ·  HUMAN-CONTROLLED</text>

  <rect x="0.75" y="0.75" width="1498.5" height="458.5" rx="23.25" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.22"/>
</svg>
