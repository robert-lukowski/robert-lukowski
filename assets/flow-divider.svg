<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="1200" height="16" preserveAspectRatio="none" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.45" stop-color="#2dd4bf"/>
      <stop offset="0.72" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0,0" to="420,0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff"/>
      <stop offset="0.88" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgeFade"><rect width="1200" height="16" fill="url(#fade)"/></mask>
    <filter id="blur" x="-2%" y="-300%" width="104%" height="700%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <g mask="url(#edgeFade)">
    <rect y="6" width="1200" height="4" rx="2" fill="url(#flow)" opacity="0.35" filter="url(#blur)"/>
    <rect y="7" width="1200" height="2" rx="1" fill="url(#flow)"/>
    <circle cy="8" r="4" fill="#f8fafc">
      <animate attributeName="cx" values="0;1200" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
